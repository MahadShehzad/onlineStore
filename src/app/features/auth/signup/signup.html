<div class="auth-wrap">
  <div class="auth-card p-4 p-sm-5">
    <div class="text-center mb-4">
      <a routerLink="/" class="d-inline-flex align-items-center gap-2 fw-bold fs-4 text-brand">
        <i class="bi bi-bag-check-fill text-accent"></i> onlineStore
      </a>
      <p class="text-muted mb-0 mt-1">Create your account</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
    }

    <div class="btn-group w-100 mb-3" role="group" aria-label="Account type">
      <button
        type="button"
        class="btn"
        [class.btn-primary]="!isVendor()"
        [class.btn-outline-primary]="isVendor()"
        (click)="selectRole('Customer')"
      >
        <i class="bi bi-person me-1"></i> Customer
      </button>
      <button
        type="button"
        class="btn"
        [class.btn-primary]="isVendor()"
        [class.btn-outline-primary]="!isVendor()"
        (click)="selectRole('Vendor')"
      >
        <i class="bi bi-shop me-1"></i> Vendor
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input
          id="name"
          class="form-control"
          formControlName="name"
          autocomplete="name"
          [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid"
        />
        <div class="invalid-feedback">Enter your name (2+ characters).</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="email"
          [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="new-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <div class="invalid-feedback">At least 6 characters.</div>
      </div>

      @if (isVendor()) {
        <div class="mb-3">
          <label class="form-label" for="storeName">Store name</label>
          <input
            id="storeName"
            class="form-control"
            formControlName="storeName"
            [class.is-invalid]="form.controls.storeName.touched && form.controls.storeName.invalid"
          />
          <div class="form-text">Your store goes live once an admin approves it.</div>
          <div class="invalid-feedback">A store name is required for vendor accounts.</div>
        </div>
      }

      <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Create account
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0">
      Already have an account?
      <a routerLink="/login" class="text-accent fw-semibold">Sign in</a>
    </p>
  </div>
</div>
