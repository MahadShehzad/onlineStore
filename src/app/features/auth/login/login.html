<div class="auth-wrap">
  <div class="auth-card p-4 p-sm-5">
    <div class="text-center mb-4">
      <a routerLink="/" class="d-inline-flex align-items-center gap-2 fw-bold fs-4 text-brand">
        <i class="bi bi-bag-check-fill text-accent"></i> onlineStore
      </a>
      <p class="text-muted mb-0 mt-1">Sign in to your account</p>
    </div>

    @if (error()) {
      <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="email"
          [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <div class="invalid-feedback">Password is required.</div>
      </div>

      <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Sign in
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0">
      New here? <a routerLink="/signup" class="text-accent fw-semibold">Create an account</a>
    </p>
  </div>
</div>
